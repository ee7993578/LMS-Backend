name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://lms-backend-ztjf.onrender.com/actuator/health)
          echo "Response code: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: backend did not return 200"
          fi